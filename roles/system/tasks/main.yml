- name: Services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ services_system }}"

- name: NVIDIA runtime power management
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: nvidia-pm.conf, dest: /etc/modprobe.d/nvidia-pm.conf }
    - { src: 80-nvidia-pm.rules, dest: /etc/udev/rules.d/80-nvidia-pm.rules }
  loop_control: { label: "{{ item.dest }}" }
  when: hybrid_gpu
  notify: Reload udev rules

- name: Backlight access (video group)
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: video
    append: true
  when: laptop

- name: CPU turbo switch writable by wheel
  ansible.builtin.copy:
    src: cpu-turbo.conf
    dest: "{{ system_cpu_turbo_conf }}"
    mode: "0644"
  when: laptop
  notify: Apply tmpfiles rules

- name: PAM service of the Quickshell lock screen
  ansible.builtin.copy:
    src: quickshell-lock.pam
    dest: /etc/pam.d/quickshell-lock
    mode: "0644"
