# Run once at the end of the play, only when a file was copied.
- name: Reload Hyprland
  listen: reload desktop
  ansible.builtin.shell: |
    set -o pipefail
    sig=$(ls -t "$XDG_RUNTIME_DIR/hypr" 2>/dev/null | head -n1)
    [ -n "$sig" ] || exit 0
    export HYPRLAND_INSTANCE_SIGNATURE="$sig"
    hyprctl reload
    hyprctl setcursor {{ cursor_theme_name }} {{ cursor_theme_size }}
    true
  args: { executable: /bin/bash }
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  changed_when: false

- name: Reload Quickshell
  listen: reload desktop
  ansible.builtin.shell: |
    set -o pipefail
    for pid in $(qs list --all | awk '/Process ID:/ {print $3}'); do
      qs ipc --pid "$pid" call shell reload || true
    done
  args: { executable: /bin/bash }
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  changed_when: false

- name: Reload tmux
  listen: reload desktop
  ansible.builtin.shell: |
    set -o pipefail
    command -v tmux >/dev/null || exit 0
    tmux source-file "$HOME/.config/tmux/tmux.conf" 2>/dev/null || true
  args: { executable: /bin/bash }
  environment:
    HOME: "{{ home_dir }}"
  changed_when: false
