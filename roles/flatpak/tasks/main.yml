- name: System-wide flatpak setup
  become: true
  block:
    - name: Add the Flathub remote
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        state: present

    - name: Install flatpaks
      community.general.flatpak:
        name: "{{ flatpaks }}"
        remote: flathub
        state: present

    - name: Remove unwanted flatpaks
      community.general.flatpak:
        name: "{{ flatpaks_removed | difference(flatpaks) }}"
        state: absent
      when: debloat | bool
