# General
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -g mouse on
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000

# Session
set -g destroy-unattached on

# Copy
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keys
bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Status bar
set -g status-position top
set -g status-style "bg=colour5,fg=colour0"
set -g status-left "#[bold] #S #[nobold]"
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[bg=colour0 fg=colour5 bold] PREFIX ,}"

# Window tabs
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-format " #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-current-style default
set -g window-status-current-format "#[bg=colour0,fg=colour5,bold] #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-bell-style "bg=colour0,fg=colour5,reverse"

# Messages and borders
set -g message-style "bg=colour0,fg=colour5,bold"
set -g message-format " #{message} "
set -g mode-style "bg=colour5,fg=colour0"
set -g pane-border-style "fg=colour5,bg=default"
set -g pane-active-border-style "fg=colour5,bg=default"
set -g pane-border-lines single
