# General
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -g mouse on
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000

# Session
set -g destroy-unattached on

# Copy
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keys
bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Status bar
set -g status-position top
set -g status-style "bg=colour216,fg=colour234"
set -g status-left "#[bold] #S #[nobold]"
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[bg=colour234 fg=colour216 bold] PREFIX ,}"

# Windows
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-format " #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-current-style default
set -g window-status-current-format "#[bg=colour234,fg=colour216,bold] #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-bell-style "bg=colour234,fg=colour216,reverse"

# Messages and borders
set -g message-style "bg=colour234,fg=colour216,bold"
set -g message-format " #{message} "
set -g mode-style "bg=colour216,fg=colour234"
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=colour216"
